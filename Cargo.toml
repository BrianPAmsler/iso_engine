[package]
name = "opengl_engine"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["derive-serialize","error", "error/macros", "multi-impl", "swizz"]
resolver = "3"

[dependencies]
multi-impl = { path = "multi-impl" }
swizz = { path = "swizz" }
backtrace = "0.3.73"
const_format = "0.2.32"
downcast-rs = "1.2.0"
function_name = "0.3.0"
image = "0.25.4"
itertools = "0.13.0"
lazy_static = "1.5.0"
libc = "0.2.151"
libffi = "3.2.0"
native-dialog = "0.7.0"
pathbuf = "1.0.0"
regex = "1.10.6"
spez = "0.1.2"
thiserror = "1.0.56"
rand = "0.10.1"
log = "0.4.29"
vulkano = "0.35.2"
winit = "0.30.13"
vulkano-shaders = "0.35.0"
bytemuck = "1.25.0"
error = { version = "0.1.0", path = "error" }
resource-packager = { git = "https://github.com/BrianPAmsler/resource_packager.git", version = "0.1.0" }
delegate = "0.13.5"
serde = "1.0.228"
serde_json = "1.0.150"
postcard = "1.1.3"
derive-serialize = { version = "0.1.0", path = "derive-serialize" }
taffy = "0.11.0"
quick-xml = "0.41.0"
nalgebra = "0.33.1"
typenum = "1.17.0"
num = "0.4.3"

# [profile.release]
# debug=true

[dev-dependencies]
tempfile = "3.24.0"
shh = "1.0.1"

[workspace.lints.clippy]
module_inception = "allow"

unwrap_used = "warn"
expect_used = "warn"
empty_structs_with_brackets = "warn"

allow_attributes_without_reason = "forbid"

[workspace.lints.rust]
unsafe_code = "deny"